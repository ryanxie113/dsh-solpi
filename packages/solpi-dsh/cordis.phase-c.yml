# Phase C acceptance overlay: fusion plugin replaces stock tool-fs.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      qwen-proxy:
        api: openai-completions
        baseURL: http://<QWEN_PROXY_HOST>:30000/v1
        apiKeyEnv: SOLPI_QWEN_PROXY_DUMMY_KEY
        models:
          - id: GLM-5.3-Flash
            name: GLM-5.3-Flash
            contextWindow: 262144
            maxTokens: 65536
            input: [text]

- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: qwen-proxy
    model: GLM-5.3-Flash

# AF contract: composition-level exclusion of the whole tool-fs package;
# our plugin re-registers read/read_image unchanged + fused write/edit.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  disabled: true

# OP contract (user decision "B"): ObservationPack composes over the NATIVE
# spill-policy mechanism rather than duplicating it. We retune the stock row's
# threshold to pi parity (10KB) via its real Config schema; observation-pack.ts
# adds only boot-time compose visibility + the Phase-D EPR exemption seam.
- id: spill-policy
  name: '@deepseek-ai/dsh-spill-policy'
  config:
    maxInlineBytes: 10240

- insert:
    - id: solpi-dsh-action-fusion
      name: '<REPO_ROOT>/packages/solpi-dsh/src/action-fusion.ts'
    - id: solpi-dsh-op
      name: '<REPO_ROOT>/packages/solpi-dsh/src/observation-pack.ts'
      config:
        maxInlineBytes: 10240
